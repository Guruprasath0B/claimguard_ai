name: ClaimGuard-AI CI/CD

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main


jobs:

  # ---------------------------------------------------------
  # 1. Code Quality & Linting
  # ---------------------------------------------------------
  lint:
    name: Code Quality - Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff
        run: |
          ruff check . --exit-zero


  # ---------------------------------------------------------
  # 2. Automated Tests
  # ---------------------------------------------------------
  test:
    name: Automated Tests - Pytest
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests/ -v


  # ---------------------------------------------------------
  # 3. Build & Push Docker Image to Docker Hub
  # ---------------------------------------------------------
  docker-build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    # Only push images when code is actually pushed to main.
    # Pull requests and develop branch will run tests but won't
    # publish an image to Docker Hub.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            guruprasath03/claimguard_ai:latest
            guruprasath03/claimguard_ai:${{ github.sha }}
